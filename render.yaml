services:
  - type: web
    name: langgraph-groq-chatbot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontand.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: DATABASE_PATH
        value: /var/data/chat_history.db
    disk:
      name: chat-history
      mountPath: /var/data
      sizeGB: 1
